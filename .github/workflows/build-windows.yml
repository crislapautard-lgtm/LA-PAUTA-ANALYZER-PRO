name: Build La Pauta Analyzer Pro (Windows VST3 + Instalador)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Sin -G: CMake detecta solo la versión de Visual Studio instalada
      - name: Configurar
        run: cmake -B build

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Analyzer-Pro-VST3-Windows
          path: build/LaPautaAnalyzerPro_artefacts/Release/VST3/

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Analyzer-Pro-Instalador
          path: installer_output/La-Pauta-Analyzer-Pro-Setup.exe
